<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
  YOUTUBE GIVEAWAY FOREVER ♾️ 
</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<!-- LOGIN PAGE -->

<div class="card"
id="loginPage">

<h1 class="title">
LOGIN
</h1>

<input
type="text"
id="username"
placeholder="Enter Username">

<input
type="password"
id="password"
placeholder="Enter Password">

<button onclick="loginUser()">

LOGIN

</button>

</div>



<!-- HOME PAGE -->

<div class="card hidden"
id="homePage">

<h1 class="title">
WELCOME
</h1>

<p id="welcomeText"></p>



<!-- BALANCE -->

<div class="balanceBox">

<div class="balanceItem">

<h3>
ALL TIME EARNING
</h3>

<p id="earning">
0
</p>

</div>

<div class="balanceItem">

<h3>
ALL TIME WITHDRAWAL
</h3>

<p id="withdrawal">
0
</p>

</div>

<div class="balanceItem">

<h3>
CURRENT BALANCE
</h3>

<p id="balance">
0
</p>

</div>

</div>



<button class="videoBtn"
onclick="openVideo()">

NEW VIDEO

</button>

<button class="verifyBtn"
onclick="openSubscribe()">

SUBSCRIBE VERIFICATION

</button>

<button class="withdrawBtn"
onclick="openWithdraw()">

WITHDRAW REQUEST

</button>

<button class="reviewBtn"
onclick="openReview()">

YOUR REVIEW

</button>

</div>



<!-- SUBSCRIBE PAGE -->

<div class="card hidden"
id="subscribePage">

<h1 class="verifyTitle">
SUBSCRIBE VERIFICATION
</h1>

<input
type="text"
id="gameId"
placeholder="Game Number">

<input
type="text"
id="proofLink"
placeholder="Paste Screenshot Link">

<button class="submitBtn"
onclick="submitSubscribe()">

SUBMIT

</button>

<button class="backBtn"
onclick="backHome()">

BACK

</button>

</div>



<!-- WITHDRAW PAGE -->

<div class="card hidden"
id="withdrawPage">

<h1 class="withdrawTitle">
WITHDRAW REQUEST
</h1>

<input
type="text"
id="withdrawGameId"
placeholder="Game Number">

<div class="amountButtons">

<button onclick="selectAmount(30000)">
30000
</button>

<button onclick="selectAmount(50000)">
50000
</button>

<button onclick="selectAmount(80000)">
80000
</button>

<button onclick="selectAmount(100000)">
100000
</button>

<button onclick="selectAmount(150000)">
150000
</button>

</div>

<p id="selectedAmount">
Selected: 0
</p>

<button class="submitBtn"
onclick="submitWithdraw()">

SUBMIT

</button>

<button class="backBtn"
onclick="backHome()">

BACK

</button>

</div>



<!-- REVIEW PAGE -->

<div class="card hidden"
id="reviewPage">

<h1 class="reviewTitle">
YOUR REVIEW
</h1>

<textarea
id="reviewText"
placeholder="Write Your Review"></textarea>

<input
type="text"
id="reviewImage"
placeholder="Paste Screenshot Link">

<button class="submitBtn"
onclick="submitReview()">

SUBMIT REVIEW

</button>

<button class="backBtn"
onclick="backHome()">

BACK

</button>

</div>

<script src="script.js"></script>

</body>
</html>
